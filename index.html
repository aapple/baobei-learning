<!DOCTYPE html>
<html lang="zh-CN" class="theme-grass">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>宝贝学习乐园 🌈</title>
<style>
/* ============ 护眼主题 ============ */
:root{
  --r-lg:26px; --r-md:20px; --r-sm:14px;
  --shadow:0 8px 24px rgba(90,110,80,.12);
  --shadow-lg:0 12px 32px rgba(90,110,80,.18);
  --fs-base:clamp(15px, 1.05vw + 10px, 22px);
  --accent:#7BB661; --accent2:#F2A649; --accent3:#6FA8DC; --accent4:#E886B0; --accent5:#9B8CE0;
  --maxw:1280px;
}
.theme-grass{
  --bg1:#EDF4E3; --bg2:#F6F9EE; --bg3:#EDF5F0;
  --card:#FDFDF8; --ink:#42503B; --ink2:#8A9683; --line:#E3EAD8;
  --soft:#F4F8EC;
}
.theme-warm{
  --bg1:#F9F1DE; --bg2:#FCF8EF; --bg3:#F9F3E4;
  --card:#FFFDF6; --ink:#5C4E33; --ink2:#A3936F; --line:#EFE5CC;
  --soft:#FAF4E4;
}
.theme-night{
  --bg1:#2A3040; --bg2:#313950; --bg3:#2C3446;
  --card:#39415A; --ink:#EDEAE0; --ink2:#A6ACC2; --line:#4A5470;
  --soft:#404A66; --shadow:0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{font-size:var(--fs-base);}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:linear-gradient(150deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
  background-attachment:fixed; min-height:100vh; line-height:1.5;
}
button{font-family:inherit; color:inherit;}

/* ============ 顶栏 ============ */
header{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:.8em; padding:.6em 1.2em;
  background:linear-gradient(100deg,#7BB661,#5FA3C9);
  box-shadow:0 4px 18px rgba(70,110,60,.25); color:#fff;
}
.theme-night header{background:linear-gradient(100deg,#4A6B8A,#5B5A9E);}
.brand{display:flex; align-items:center; gap:.5em; cursor:pointer; flex:1; min-width:0;}
.brand .logo{font-size:1.8em; filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));}
.brand h1{font-size:1.25em; margin:0; font-weight:800; letter-spacing:.05em; white-space:nowrap;}
.hstat{
  display:flex; align-items:center; gap:.35em; background:rgba(255,255,255,.22);
  padding:.35em .9em; border-radius:999px; font-weight:800; font-size:1em; white-space:nowrap;
}
.hbtn{
  border:none; background:rgba(255,255,255,.22); border-radius:.7em; color:#fff;
  width:2.4em; height:2.4em; font-size:1.05em; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.hbtn:active{transform:scale(.9);}

/* ============ 顶部导航 tab ============ */
nav.tabs{
  position:sticky; top:3.6em; z-index:40; display:flex; gap:.5em; overflow-x:auto;
  padding:.6em 1.2em; background:color-mix(in srgb, var(--bg2) 88%, transparent);
  backdrop-filter:blur(8px); scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none;}
.tab{
  border:none; cursor:pointer; border-radius:999px; padding:.55em 1.2em; font-weight:800; font-size:.95em;
  background:var(--card); color:var(--ink2); box-shadow:var(--shadow); white-space:nowrap;
  display:flex; align-items:center; gap:.4em; transition:transform .12s;
}
.tab:active{transform:scale(.95);}
.tab.active{color:#fff; background:var(--tabc,var(--accent));}

main{max-width:var(--maxw); margin:0 auto; padding:1.2em 1.2em 5em; position:relative;}

/* ============ 通用 ============ */
.view{display:none; animation:fade .3s ease; position:relative;}
.view:fullscreen{background:linear-gradient(150deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%); overflow-y:auto; padding:1.4em 1.2em;}
.view:fullscreen .card{max-width:var(--maxw); margin:0 auto 1.1em;}
#gofs{position:absolute; top:.35em; right:.35em; z-index:20; display:none; width:2.6em; height:2.6em; border:none; border-radius:50%; background:var(--accent); color:#fff; font-size:1.1em; cursor:pointer; box-shadow:var(--shadow); align-items:center; justify-content:center; opacity:.92;}
#gofs:active{transform:scale(.9);}
.view.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
.card{background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:1.3em; margin-bottom:1.1em;}
.mtitle{display:flex; align-items:center; gap:.5em; margin:0 0 .3em; font-size:1.35em; font-weight:800;}
.sub{color:var(--ink2); font-size:.9em; margin:.1em 0 1em;}
.btn{
  border:none; cursor:pointer; border-radius:1em; background:var(--accent); color:#fff; font-weight:800; font-size:1em;
  padding:.7em 1.6em; min-height:2.9em; box-shadow:var(--shadow); display:inline-flex; align-items:center; justify-content:center; gap:.4em;
}
.btn:active{transform:scale(.95);}
.btn.blue{background:var(--accent3);} .btn.orange{background:var(--accent2);} .btn.pink{background:var(--accent4);} .btn.purple{background:var(--accent5);} .btn.plain{background:var(--soft); color:var(--ink);}
.btnrow{display:flex; gap:.7em; flex-wrap:wrap; justify-content:center; margin-top:1em;}
.center{text-align:center;}

/* 选项按钮 */
.grid4{display:grid; grid-template-columns:repeat(2,1fr); gap:.9em; max-width:30em; margin:0 auto;}
.opt{
  border:none; cursor:pointer; border-radius:var(--r-md); background:var(--soft); color:var(--ink);
  font-size:1.6em; font-weight:800; min-height:3.4em; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; padding:.4em; transition:transform .1s;
}
.opt:active{transform:scale(.94);}
.opt.ok{background:#7BB661; color:#fff; animation:jump .45s;}
.opt.no{background:#E8918F; color:#fff; animation:shake .4s;}
@keyframes jump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ============ 首页 ============ */
.hero{
  background:linear-gradient(115deg,#7BB661,#A8C97F); border-radius:var(--r-lg); padding:1.4em;
  color:#fff; box-shadow:var(--shadow-lg); margin-bottom:1.1em; display:flex; flex-wrap:wrap; align-items:center; gap:1em;
}
.hero .hi{flex:1; min-width:12em;}
.hero h2{margin:0 0 .3em; font-size:1.5em; text-shadow:0 2px 4px rgba(0,0,0,.15);}
.hero p{margin:0; opacity:.95;}
.hero .mascot{font-size:3.2em; filter:drop-shadow(0 4px 6px rgba(0,0,0,.2)); animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}

.tasks{display:grid; grid-template-columns:repeat(auto-fit,minmax(15em,1fr)); gap:.8em; margin-bottom:1.1em;}
.task{
  background:var(--card); border-radius:var(--r-md); padding:1em 1.2em; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:.8em; cursor:pointer; border:2px dashed var(--line);
}
.task .t-ic{font-size:1.8em;}
.task.done{border:2px solid #7BB661; background:color-mix(in srgb,#7BB661 10%, var(--card));}
.task .t-tx b{display:block;} .task .t-tx span{font-size:.82em; color:var(--ink2);}

.mods{display:grid; grid-template-columns:repeat(auto-fit,minmax(11em,1fr)); gap:.9em;}
.modbtn{
  border:none; cursor:pointer; border-radius:var(--r-lg); color:#fff; font-weight:800; font-size:1.1em;
  padding:1.2em .8em; min-height:7.2em; box-shadow:var(--shadow); text-align:center;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.35em; transition:transform .15s;
}
.modbtn:hover{transform:translateY(-3px);}
.modbtn:active{transform:scale(.95);}
.modbtn .m-ic{font-size:2.1em; filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));}
.modbtn .m-desc{font-size:.72em; font-weight:600; opacity:.92;}

/* ============ 放大弹窗（双击卡片放大看细节）============ */
#zoomOverlay{position:fixed; inset:0; z-index:900; background:rgba(35,45,35,.55); display:flex; align-items:center; justify-content:center; cursor:pointer; animation:fade .15s ease-out;}
#zoomCard{background:var(--card); color:var(--ink); border-radius:2em; padding:clamp(1.4em,5vh,3em) clamp(1.4em,7vw,5em); box-shadow:0 14px 44px rgba(0,0,0,.32); text-align:center; cursor:pointer; animation:pop .2s ease-out; max-width:88vw;}
#zoomCard .z-main{font-size:clamp(5.5em,32vh,19em); font-weight:900; line-height:1.15;}
#zoomCard .z-sub{font-size:clamp(1.7em,6vh,3.2em); color:var(--ink2); font-weight:700; margin-top:.5em; line-height:1.7;}
#zoomCard .z-wrap{display:block; width:clamp(2em,6vh,4em); margin:0 auto; border-radius:.5em; padding:.5em; box-sizing:border-box;}
#zoomCard .z-wrap img{width:100%; height:auto; display:block;}

/* 进度环 */
.rings{display:flex; flex-wrap:wrap; gap:1em; justify-content:space-around; padding:.4em 0 .2em;}
.rc{text-align:center;}
.rc .rl{font-size:.82em; font-weight:700; color:var(--ink2); margin-top:.2em;}

/* ============ 卡片网格（字母/汉字）============ */
.tilegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(5.2em,1fr)); gap:.7em;}
.tile{
  border:none; cursor:pointer; border-radius:var(--r-md); color:#fff; font-weight:900;
  padding:.8em .3em; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; gap:.15em; min-height:5.4em; justify-content:center;
}
.tile:active{transform:scale(.93);}
.tile .up{font-size:1.9em;} .tile .low{font-size:.95em; opacity:.92;}
.tile .t-emoji{font-size:2.2em;}
.tile .t-ch{font-size:1.7em;}

.bigq{
  font-size:clamp(4em, 12vw, 7em); font-weight:900; text-align:center; line-height:1.15; margin:.15em 0;
  user-select:none; cursor:pointer;
}
.speakbtn{
  width:3.6em; height:3.6em; border-radius:50%; border:none; background:var(--accent3); color:#fff; cursor:pointer;
  font-size:1.4em; box-shadow:var(--shadow); margin:0 auto .8em; display:flex; align-items:center; justify-content:center;
}
.speakbtn:active{transform:scale(.88);}

/* ============ 古诗 ============ */
.poemcard{
  background:var(--card); border-radius:var(--r-md); padding:1.1em 1.3em; box-shadow:var(--shadow); margin-bottom:.9em;
  border-left:.5em solid var(--accent); cursor:pointer;
}
.poemcard h3{margin:0 0 .1em; font-size:1.2em;}
.poemcard .au{color:var(--ink2); font-size:.82em; margin-bottom:.6em;}
.pline{display:flex; flex-wrap:wrap; gap:.1em .9em; margin:.4em 0; justify-content:flex-start;}
.pchar{display:flex; flex-direction:column; align-items:center; min-width:1.3em;}
.pchar .py{font-size:.72em; color:var(--accent5); font-weight:700;}
.pchar .ch{font-size:1.45em; font-weight:800;}

/* ============ 数字 ============ */
.fruits{display:flex; flex-wrap:wrap; gap:.55em; justify-content:center; max-width:24em; margin:.6em auto;}
.fruits span{font-size:2.3em; filter:drop-shadow(0 3px 3px rgba(0,0,0,.12)); animation:pop-in .3s;}
@keyframes pop-in{from{transform:scale(0)}to{transform:scale(1)}}
.seg{display:flex; gap:.6em; justify-content:center; margin-bottom:1em; flex-wrap:wrap;}
.seg button{
  border:none; cursor:pointer; border-radius:1em; padding:.55em 1.2em; font-weight:800; font-size:.95em;
  background:var(--soft); color:var(--ink); min-height:2.6em; box-shadow:var(--shadow);
}
.seg button.on{background:var(--accent2); color:#fff;}

/* ============ 记忆翻牌 ============ */
.memgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:.7em; max-width:26em; margin:0 auto;}
.mem{
  border:none; cursor:pointer; aspect-ratio:1; border-radius:var(--r-md); font-size:2.4em;
  background:linear-gradient(135deg,var(--accent3),var(--accent5)); color:transparent; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; transition:transform .2s;
}
.mem.flip{background:var(--soft); color:var(--ink); transform:rotateY(180deg);}
.mem.done{background:color-mix(in srgb,#7BB661 25%, var(--card)); opacity:.55; cursor:default;}

/* ============ 安全问答 ============ */
.safecard{border-left:.5em solid var(--accent4);}
.tipbox{
  background:color-mix(in srgb, var(--accent2) 16%, var(--card)); border-radius:var(--r-md);
  padding:.9em 1.1em; font-weight:700; margin-top:1em; display:none;
}
.tipbox.show{display:flex; gap:.6em; align-items:flex-start; animation:fade .3s;}
.tipbox .t2{font-size:1.6em;}

/* ============ 徽章 ============ */
.badgewall{display:grid; grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr)); gap:.9em;}
.badge{background:var(--card); border-radius:var(--r-md); padding:1em .5em; text-align:center; box-shadow:var(--shadow);}
.badge .b-ic{font-size:2.6em;}
.badge .bn{font-size:.88em; font-weight:800; margin-top:.2em;}
.badge .bd{font-size:.72em; color:var(--ink2); margin-top:.15em;}
.badge.locked{filter:grayscale(1); opacity:.5;}

/* ============ 反馈 ============ */
#toast{position:fixed; left:50%; bottom:6em; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:.5em; align-items:center; pointer-events:none;}
.toast{
  background:color-mix(in srgb, var(--ink) 90%, transparent); color:var(--card); padding:.55em 1.3em;
  border-radius:999px; font-weight:800; box-shadow:var(--shadow-lg); animation:pop .3s; font-size:1.05em;
}
@keyframes pop{from{transform:scale(.7); opacity:0}to{transform:scale(1); opacity:1}}
.floatstar{
  position:fixed; z-index:95; pointer-events:none; font-weight:900; font-size:1.8em;
  animation:rise 1s ease forwards; text-shadow:0 2px 6px rgba(0,0,0,.2);
}
@keyframes rise{from{transform:translateY(0) scale(.8); opacity:1}to{transform:translateY(-5.5em) scale(1.25); opacity:0}}
#confetti{position:fixed; inset:0; z-index:94; pointer-events:none;}

/* ============ 弹窗 ============ */
.mask{position:fixed; inset:0; background:rgba(40,50,40,.5); z-index:80; display:none; align-items:center; justify-content:center; padding:1.2em;}
.mask.show{display:flex;}
.modal{background:var(--card); border-radius:var(--r-lg); padding:1.5em; width:100%; max-width:26em; box-shadow:var(--shadow-lg);}
.modal h3{margin:0 0 .6em; font-size:1.3em;}
.modal .mrow{display:flex; gap:.6em; flex-wrap:wrap; margin-bottom:.8em;}
.theme-pick{display:flex; gap:.6em; margin:.6em 0 1em;}
.theme-pick button{
  flex:1; border:2px solid var(--line); background:var(--soft); border-radius:var(--r-md);
  padding:.7em .3em; font-weight:800; cursor:pointer; font-size:.9em;
}
.theme-pick button.on{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 14%, var(--card));}

/* 电视遥控焦点样式 */
@media (pointer:coarse), (min-width:1400px){
  .opt:focus,.tab:focus,.modbtn:focus,.tile:focus,.mem:focus,.task:focus,.btn:focus{
    outline:.28em solid var(--accent2); outline-offset:.2em;
  }
}
@media (max-width:640px){
  .brand h1{font-size:1.05em;}
  main{padding:1em .9em 4em;}
  .memgrid{gap:.5em;}
}
</style>
</head>
<body>

<header>
  <div class="brand" onclick="go('home')">
    <span class="logo">🚀</span><h1>宝贝学习乐园</h1>
  </div>
  <div class="hstat" title="我的星星">⭐ <span id="starCount">0</span></div>
  <div class="hstat" title="今日连击" id="comboBox">🔥 <span id="comboCount">0</span></div>
  <button class="hbtn" onclick="fsToggle()" title="全屏显示">⛶</button>
  <button class="hbtn" onclick="cycleTheme()" title="切换护眼主题">🎨</button>
  <button class="hbtn" onclick="openSettings()" title="家长设置">⚙️</button>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="main">
  <button id="gofs" title="当前模块全屏">⛶</button>
  <div class="view active" id="view-home"></div>
  <div class="view" id="view-abc"></div>
  <div class="view" id="view-pinyin"></div>
  <div class="view" id="view-hanzi"></div>
  <div class="view" id="view-num"></div>
  <div class="view" id="view-poem"></div>
  <div class="view" id="view-idiom"></div>
  <div class="view" id="view-logic"></div>
  <div class="view" id="view-safe"></div>
  <div class="view" id="view-sign"></div>
  <div class="view" id="view-badge"></div>
</main>

<div id="toast"></div>
<canvas id="confetti"></canvas>

<div class="mask" id="setMask" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h3>👨‍👩‍👧 家长设置</h3>
    <p class="sub" style="margin:0 0 .4em">🔊 朗读声音（云朵姐姐/阳光哥哥是微软真人级神经网络语音，需联网，首次播放稍有延迟）</p>
    <div class="theme-pick" id="voicePick">
      <button data-v="F">☁️ 云朵姐姐</button>
      <button data-v="M">🌞 阳光哥哥</button>
      <button data-v="off">📴 系统语音</button>
    </div>
    <p class="sub" id="voiceTip" style="margin:.2em 0 .8em"></p>
    <div class="mrow">
      <button class="btn blue" id="preloadBtn" onclick="preloadVoices()">⬇️ 预缓存常用语音</button>
    </div>
    <p class="sub" id="preloadNote" style="margin:.1em 0 .8em">把字母、数字、常用字的真人语音提前下载到本机，之后即使断网也能秒播。</p>
    <div class="theme-pick" id="themePick">
      <button data-th="theme-grass">🌿 草地护眼</button>
      <button data-th="theme-warm">🌅 暖阳护眼</button>
      <button data-th="theme-night">🌙 星夜模式</button>
    </div>
    <p class="sub" style="margin-top:0">可以备份或清空宝贝的学习进度（星星、徽章、打卡记录）。建议投屏时选择「草地护眼」，睡前用「星夜模式」。</p>
    <div class="mrow">
      <button class="btn blue" onclick="exportJSON()">📤 导出进度</button>
      <button class="btn orange" onclick="document.getElementById('impFile').click()">📥 导入恢复</button>
    </div>
    <input type="file" id="impFile" accept="application/json" style="display:none" onchange="importJSON(event)">
    <div class="mrow">
      <button class="btn pink" onclick="resetProgress()">🧹 清空进度</button>
      <button class="btn plain" onclick="closeSettings()">关闭</button>
    </div>
    <p class="sub" id="setNote" style="margin-bottom:0"></p>
  </div>
</div>

<script>
/* ================================================================
   宝贝学习乐园 —— 纯前端单文件，数据保存在浏览器本地
   模块：字母 / 识字 / 数字 / 古诗 / 逻辑 / 安全 / 徽章
================================================================ */

/* ============ 基础数据 ============ */
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const LCOLOR=['#7BB661','#6FA8DC','#F2A649','#E886B0','#9B8CE0'];

const WORDS=[ /* 看图识字：常用字 + 词 + emoji */
  {ch:'大',py:'dà',word:'大象',emoji:'🐘'},{ch:'小',py:'xiǎo',word:'小鱼',emoji:'🐟'},
  {ch:'山',py:'shān',word:'高山',emoji:'⛰️'},{ch:'水',py:'shuǐ',word:'喝水',emoji:'💧'},
  {ch:'火',py:'huǒ',word:'火焰',emoji:'🔥'},{ch:'木',py:'mù',word:'树木',emoji:'🌳'},
  {ch:'花',py:'huā',word:'花朵',emoji:'🌸'},{ch:'鸟',py:'niǎo',word:'小鸟',emoji:'🐦'},
  {ch:'马',py:'mǎ',word:'小马',emoji:'🐴'},{ch:'牛',py:'niú',word:'奶牛',emoji:'🐄'},
  {ch:'月',py:'yuè',word:'月亮',emoji:'🌙'},{ch:'日',py:'rì',word:'太阳',emoji:'☀️'},
  {ch:'云',py:'yún',word:'白云',emoji:'☁️'},{ch:'雨',py:'yǔ',word:'下雨',emoji:'🌧️'},
  {ch:'果',py:'guǒ',word:'苹果',emoji:'🍎'},{ch:'书',py:'shū',word:'看书',emoji:'📖'},
  {ch:'车',py:'chē',word:'汽车',emoji:'🚗'},{ch:'门',py:'mén',word:'开门',emoji:'🚪'},

/* 持久层：IndexedDB 存合成好的 mp3，页面刷新后依然秒播 */
const ttsDB={
  db:null, ready:false, putCount:0,
  open(){
    return new Promise(res=>{
      try{
        const req=indexedDB.open('baobei_tts',1);
        req.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('audio')) e.target.result.createObjectStore('audio',{keyPath:'key'}); };
        req.onsuccess=e=>{this.db=e.target.result;this.ready=true;res(true);};
        req.onerror=()=>res(false);
      }catch(e){res(false);}
    });
  },
  get(key){
    return new Promise(res=>{
      if(!this.ready)return res(null);
      try{
        const r=this.db.transaction('audio','readonly').objectStore('audio').get(key);
        r.onsuccess=()=>res(r.result||null);
        r.onerror=()=>res(null);
      }catch(e){res(null);}
    });
  },
  put(key,blob){
    return new Promise(res=>{
      if(!this.ready)return res(false);
      try{
        const st=this.db.transaction('audio','readwrite').objectStore('audio');
        st.put({key:key,ts:Date.now(),blob:blob});
        st.transaction.oncomplete=()=>res(true);
        st.transaction.onerror=()=>res(false);
      }catch(e){res(false);}
    });
  },
  count(){
    return new Promise(res=>{
      if(!this.ready)return res(0);
      try{
        const r=this.db.transaction('audio','readonly').objectStore('audio').count();
        r.onsuccess=()=>res(r.result);
        r.onerror=()=>res(0);
      }catch(e){res(0);}
    });
  },
  trim(max){ /* 超量时淘汰最旧的记录 */
    if(!this.ready)return;
    try{
      const r=this.db.transaction('audio','readonly').objectStore('audio').getAll();
      r.onsuccess=()=>{
        const all=r.result;
        if(all.length<=max)return;
        all.sort((a,b)=>a.ts-b.ts);
        const del=all.slice(0,all.length-max);
        const st=this.db.transaction('audio','readwrite').objectStore('audio');
        del.forEach(x=>st.delete(x.key));
      };
    }catch(e){}
  }
};
ttsDB.open();

  const l=bytes.length;
  bytes.push(0x80);
  while(bytes.length%64!==56)bytes.push(0);
  const bl=BigInt(l)*8n;
  for(let i=7n;i>=0n;i--)bytes.push(Number((bl>>(i*8n))&0xffn));
  let H=[0x6a09e667n,0xbb67ae85n,0x3c6ef372n,0xa54ff53an,0x510e527fn,0x9b05688cn,0x1f83d9abn,0x5be0cd19n];
  const w=new Array(64);
  for(let off=0;off<bytes.length;off+=64){
    for(let i=0;i<16;i++)
      w[i]=(BigInt(bytes[off+i*4])<<24n)|(BigInt(bytes[off+i*4+1])<<16n)|(BigInt(bytes[off+i*4+2])<<8n)|BigInt(bytes[off+i*4+3]);
    for(let i=16;i<64;i++){
      const s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>10n);
      const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>3n);
      w[i]=(w[i-16]+w[i-7]+s0+s1)&M;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let j=0;j<64;j++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch=(e&f)^((e^M)&g);
      const t1=h+S1+ch+Kn[j]+w[j];
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj=(a&b)^(a&c)^(b&c);
      const t2=S0+maj;
      h=g;g=f;f=e;e=(d+t1)&M;
      d=c;c=b;b=a;a=(t1+t2)&M;
    }
    const o=[a,b,c,d,e,f,g,h];
    for(let k=0;k<8;k++)H[k]=(H[k]+o[k])&M;
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('').toUpperCase();
}

/* 生成微软令牌（Sec-MS-GEC），有效期 5 分钟 */
function genSecGec(){
  let ticks=Math.floor(Date.now()/1000)+11644473600; /* Unix 秒 -> Windows 纪元秒 */
  ticks-=ticks%300;                                   /* 5 分钟窗口取整 */
  ticks*=10000000;                                    /* 秒 -> 100 纳秒 */
  return sha256hex(String(ticks)+TTS_TOKEN).toUpperCase();
}
function connId(){
  return (window.crypto&&crypto.randomUUID)?crypto.randomUUID().replace(/-/g,'')
    :Array.from({length:32},()=>'0123456789abcdef'[rnd(0,15)]).join('');
}

/* WebSocket 合成一次语音，返回 mp3 Blob */
function edgeSpeak(text,voice){
  return new Promise((resolve,reject)=>{
    let ws;
    try{
      ws=new WebSocket('wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1'+
        '?TrustedClientToken='+TTS_TOKEN+'&Sec-MS-GEC='+genSecGec()+'&Sec-MS-GEC-Version='+TTS_VER+'&ConnectionId='+connId());
    }catch(e){reject(e);return;}
    ws.binaryType='arraybuffer';
    const chunks=[]; let done=false;
    const timer=setTimeout(()=>{if(!done){done=true;try{ws.close()}catch(e){}reject(new Error('timeout'));}},8000);
    ws.onopen=()=>{
      ws.send('X-Timestamp:'+new Date().toString()+'\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n'+
        JSON.stringify({context:{synthesis:{audio:{metadataoptions:{sentenceBoundaryEnabled:'false',wordBoundaryEnabled:'false'},outputFormat:'audio-24khz-48kbitrate-mono-mp3'}}}}));
      const ssml="<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='zh-CN'><voice name='"+voice+"'>"+
        "<prosody rate='-10%' pitch='+0Hz'>"+escXml(text)+"</prosody></voice></speak>";
      ws.send('X-RequestId:'+connId()+'\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:'+new Date().toISOString()+'\r\nPath:ssml\r\n\r\n'+ssml);
    };
    ws.onmessage=ev=>{
      if(typeof ev.data==='string'){
        if(ev.data.indexOf('Path:turn.end')>=0){
          if(!done){done=true;clearTimeout(timer);try{ws.close()}catch(e){}
            chunks.length?resolve(new Blob(chunks,{type:'audio/mpeg'})):reject(new Error('no audio'));}
        }
      }else{
        const dv=new DataView(ev.data), hlen=dv.getUint16(0);
        chunks.push(ev.data.slice(2+hlen));
      }
    };
    ws.onerror=()=>{if(!done){done=true;clearTimeout(timer);reject(new Error('ws error'));}};
    ws.onclose=()=>{if(!done){done=true;clearTimeout(timer);
      chunks.length?resolve(new Blob(chunks,{type:'audio/mpeg'})):reject(new Error('closed'));}};
  });
}

/* --- 统一朗读入口：神经网络人声优先，系统语音兜底 --- */
let curAudio=null, speakSeq=0;
function stopSpeak(){
  speakSeq++;
  if(curAudio){try{curAudio.pause()}catch(e){} curAudio=null;}
  if(CAN_SPEAK){try{speechSynthesis.cancel()}catch(e){}}
}
function speakLocal(text,lang){
  if(!CAN_SPEAK)return;
  try{
    const u=new SpeechSynthesisUtterance(text);u.lang=lang||'zh-CN';u.rate=.85;u.pitch=1.15;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
async function speak(text,lang){
  stopSpeak();
  const seq=speakSeq;
  if(ttsMode!=='off'&&!edgeBroken&&navigator.onLine!==false){
    const voice=pickVoice(lang);
    const key=text+'|'+voice;
    try{
      let url=ttsCache.get(key);
      if(!url){
        let blob=null;
        const rec=await ttsDB.get(key);            /* 1) 查持久缓存 */
        if(rec&&rec.blob)blob=rec.blob;
        if(!blob){                                   /* 2) 在线合成（并发去重 + 失败重试一次） */
          let p=ttsInflight.get(key);
          if(!p){
            p=edgeSpeak(text,voice).catch(()=>edgeSpeak(text,voice)).finally(()=>ttsInflight.delete(key));
            ttsInflight.set(key,p);
          }
          blob=await p;
          ttsDB.put(key,blob);
          if(++ttsDB.putCount%25===0)ttsDB.trim(400);
        }
        url=URL.createObjectURL(blob);
        if(ttsCache.size>80){const first=ttsCache.keys().next().value;URL.revokeObjectURL(ttsCache.get(first));ttsCache.delete(first);}
        ttsCache.set(key,url);
      }
      if(seq!==speakSeq)return; /* 期间已有新的朗读请求 */
      curAudio=new Audio(url);curAudio._key=key;
      await curAudio.play();
      edgeFail=0;
      return;
    }catch(e){
      edgeFail++;
      if(edgeFail>=2){ /* 连续失败才降级，且 60 秒后自动尝试恢复真人语音 */
        edgeBroken=true;
        if(!edgeFallbackToasted){edgeFallbackToasted=true;
          toast(IS_EDGE?'在线语音暂不可用，已切换系统语音':'真人语音需用 Edge 浏览器打开，已暂时切换系统语音');}
        setTimeout(()=>{edgeBroken=false;edgeFail=0;},60000);
      }
      console.warn('Edge TTS 降级：',e&&e.message);
    }
  }
  if(seq===speakSeq)speakLocal(text,lang);
}

/* ============ 音效（Web Audio 合成，无需素材）============ */
let actx=null;
function tone(freq,dur,type,vol,when){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||.18,actx.currentTime+(when||0));
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+(when||0)+dur);
    o.connect(g);g.connect(actx.destination);
    o.start(actx.currentTime+(when||0));o.stop(actx.currentTime+(when||0)+dur+.05);
  }catch(e){}
}
const sndOK=()=>{tone(523,.12,'triangle',.2);tone(659,.12,'triangle',.2,.1);tone(784,.25,'triangle',.2,.2);};
const sndNO=()=>{tone(220,.25,'sawtooth',.08);};
const sndWin=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.2,i*.13));};

/* ============ 彩带庆祝 ============ */
function confetti(){
  const cv=$('confetti'),ctx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;
  const colors=['#7BB661','#F2A649','#6FA8DC','#E886B0','#9B8CE0'];
  const ps=Array.from({length:120},()=>({
    x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,
    w:6+Math.random()*8,h:8+Math.random()*10,
    vy:2.2+Math.random()*3.5,vx:-1.5+Math.random()*3,
    rot:Math.random()*Math.PI,vr:-.12+Math.random()*.24,
    c:pick(colors)
  }));
  let t=0;
  (function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    if(++t<170)requestAnimationFrame(frame);else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

  if(hard&&add){a=rnd(11,18);b=rnd(1,9-a%10);ans=a+b;sign='+';}
  else if(hard){a=rnd(11,19);b=rnd(1,a%10);ans=a-b;sign='−';}
  else if(add){a=rnd(0,9);b=rnd(0,10-a);ans=a+b;sign='+';}
  else{a=rnd(1,10);b=rnd(0,a);ans=a-b;sign='−';}
  const opts=shuffle([ans,ans+rnd(1,3),Math.max(0,ans-rnd(1,3)),ans+rnd(4,6)]);
  $('numBox').innerHTML='<p class="sub center">算一算，选出正确答案 👇</p>'+
    '<div class="bigq" style="font-size:clamp(2.6em,7vw,4.2em);color:var(--accent3)">'+a+' '+sign+' '+b+' = ?</div>'+
    '<div class="grid4">'+opts.map(o=>'<button class="opt" data-v="'+o+'" onclick="numCalcAns(this)">'+o+'</button>').join('')+'</div>';

  if(+btn.dataset.v===ans){

/* ---- 认时钟（幼小衔接）---- */
let clockCur=null;
function clockSVG(h,m){
  const cx=100,cy=100;
  let s='<svg viewBox="0 0 200 200" style="width:min(48vw,19em);display:block;margin:0 auto 1em">';
  s+='<circle cx="100" cy="100" r="94" fill="var(--card)" stroke="var(--accent3)" stroke-width="7"/>';
  for(let i=1;i<=12;i++){
    const a=i*Math.PI/6;
    s+='<text x="'+(cx+Math.sin(a)*76).toFixed(1)+'" y="'+(cy-Math.cos(a)*76+6).toFixed(1)+'" font-size="17" font-weight="800" text-anchor="middle" fill="var(--ink)">'+i+'</text>';
  }
  const ha=((h%12)+m/60)/12*2*Math.PI, ma=m/60*2*Math.PI;
  s+='<line x1="100" y1="100" x2="'+(cx+Math.sin(ha)*46).toFixed(1)+'" y2="'+(cy-Math.cos(ha)*46).toFixed(1)+'" stroke="var(--accent2)" stroke-width="8" stroke-linecap="round"/>';
  s+='<line x1="100" y1="100" x2="'+(cx+Math.sin(ma)*64).toFixed(1)+'" y2="'+(cy-Math.cos(ma)*64).toFixed(1)+'" stroke="var(--accent3)" stroke-width="5" stroke-linecap="round"/>';
  s+='<circle cx="100" cy="100" r="6" fill="var(--ink)"/></svg>';
  return s;
}
function clockGame(){
  const half=Math.random()<.4;
  const h=rnd(1,12);
  clockCur={h:h,half:half};
  const ansT=h+(half?'点半':'点');
  const pool=[ansT];
  while(pool.length<4){
    const t=rnd(1,12)+(Math.random()<.5?'点半':'点');
    if(pool.indexOf(t)<0)pool.push(t);
  }
  $('numBox').innerHTML='<p class="sub center">看一看，钟面上是几点？👇</p>'+clockSVG(h,half?30:0)+
    '<div class="grid4">'+shuffle(pool).map(o=>'<button class="opt" style="font-size:1.15em" onclick="clockAns(this)">'+o+'</button>').join('')+'</div>';
  speak('看一看，钟面上是几点？','zh-CN');
}
function clockAns(btn){
  const c=clockCur, ansT=c.h+(c.half?'点半':'点');
  if(btn.textContent===ansT){
    correct(btn);
    speak('对啦！'+(c.half?'分针指向六，时针走过'+c.h+'，就是'+ansT:'分针指向十二，时针指向'+c.h+'，就是'+ansT),'zh-CN');
    state.clock.correct++;save();checkBadges();
    if(state.clock.correct%2===0)completeTask('t_clock');
    setTimeout(clockGame,1600);
  }else wrong(btn,'先看短短的时针哦');
}

let zoomVoice=null;

  ov.innerHTML='<div id="zoomCard"><div class="z-main"'+(style?' style="'+style+'"':'')+'>'+main+'</div>'+(sub?'<div class="z-sub">'+sub+'</div>':'')+'</div>';

  /* 双击弹窗前刚播过同一句就不再重复，减少连发请求；点卡片仍正常播放 */
  if(zoomVoice&&!(curAudio&&!curAudio.paused&&curAudio._key===zoomVoice.t+'|'+pickVoice(zoomVoice.l)))speak(zoomVoice.t,zoomVoice.l);
}
function closeZoom(){const o=document.getElementById('zoomOverlay');if(o)o.remove();zoomVoice=null;}
document.addEventListener('dblclick',e=>{
  const el=e.target.closest('[data-zoom]');
  if(el)showZoom(el.dataset.zoom,el.dataset.zsub||'',el.dataset.zvoice||'',el.dataset.zlang||'zh-CN',el.dataset.zstyle||'');
});
document.addEventListener('click',e=>{
  const ov=document.getElementById('zoomOverlay');
  if(!ov)return;
  if(e.target===ov){closeZoom();return;}
  if(e.target.closest('#zoomCard')&&zoomVoice)speak(zoomVoice.t,zoomVoice.l);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom();});

}
function logicSeq(){
  const pats=[[2,4,6,8],[1,3,5,7],[5,10,15,20],[10,8,6,4],[3,6,9,12],[1,2,4,8]];
  const p=pick(pats),q=p[3];
  seqCur=q;
  const opts=shuffle([q,q+1,q-1,q+2].filter((v,i,a)=>v>0&&a.indexOf(v)===i)).slice(0,4);
  if(!opts.includes(q))opts[0]=q,opts.sort(()=>Math.random()-.5);
  $('logicBox').innerHTML='<p class="sub center">找一找规律，下一个数是几？👇</p>'+
    '<div class="bigq" style="font-size:clamp(2.2em,6vw,3.6em);color:var(--accent5)">'+p[0]+' · '+p[1]+' · '+p[2]+' · ?</div>'+
    '<div class="grid4">'+opts.map(o=>'<button class="opt" data-v="'+o+'" onclick="logicAns(this)">'+o+'</button>').join('')+'</div>';
}
let seqCur=0; /* 当前找规律题的正确答案（存变量而非从 DOM 反解析，避免误判） */
function logicAns(btn){
  if(+btn.dataset.v===seqCur){
    correct(btn);state.logic.correct++;save();checkBadges();
    if(state.logic.correct%3===0)completeTask('t_logic');

}
function logicOdd(){
  const groups=[['🐘','🐴','🦓','🐄','🐷','🐑'],['🍎','🍓','🍊','🍇','🍌','🍉'],['🚗','🚌','🚕','🚙','🚲','🚚'],['⭐','🌙','☀️','☁️','⚡','🌈']];
  const g=pick(groups);
  const other=pick(FRUITS.filter(f=>!g.includes(f)));

  const ans=items.indexOf(other);

    '<div class="fruits" style="max-width:28em">'+items.map((it,i)=>'<span>'+it+'</span>').join('')+'</div>'+
    '<div class="grid4" style="grid-template-columns:repeat(4,1fr);max-width:34em">'+
      items.map((it,i)=>'<button class="opt" style="font-size:1.8em" data-v="'+i+'" onclick="logicOddAns(this,'+ans+')">'+it+'</button>').join('')+'</div>';
}
function logicOddAns(btn,ans){

/* ---- 排顺序（逻辑小岛）---- */
let orderCur=null;
function orderGame(){
  const set=pick(ORDER_SETS);
  let arr=shuffle(set.seq.map((x,i)=>({e:x[0],n:x[1],i:i})));
  if(arr.every((x,i)=>x.i===i))arr=[arr[1],arr[0]].concat(arr.slice(2));
  orderCur={seq:set.seq,clicked:0};
  $('logicBox').innerHTML='<p class="sub center">'+set.t+'：按正确顺序点一点 👇</p>'+
    '<div class="grid4" style="max-width:30em">'+
      arr.map(x=>'<button class="opt" style="font-size:1.1em;padding:1em .5em" data-i="'+x.i+'" onclick="orderAns(this)">'+x.e+'<br>'+x.n+'</button>').join('')+'</div>'+
    '<p class="sub center" id="orderTip" style="margin-top:.7em;font-weight:800">先点第 1 个 👉</p>';
  speak(set.t+'，按正确顺序点一点','zh-CN');
}
function orderAns(btn){
  const o=orderCur;
  if(+btn.dataset.i===o.clicked){
    correct(btn);
    btn.disabled=true;
    o.clicked++;
    $('orderTip').textContent=o.clicked<o.seq.length?('真棒！再点第 '+(o.clicked+1)+' 个 👉'):'全部正确！🎉';
    if(o.clicked===o.seq.length){
      speak('太棒了！'+o.seq.map(x=>x[1]).join('，'),'zh-CN');
      state.order.win++;save();checkBadges();
      if(state.order.win%2===0)completeTask('t_order');
      setTimeout(orderGame,2200);
    }
  }else wrong(btn,'想一想哪个在前哦');
}
let memState=null;
function logicMem(){
  const cards=shuffle(MEM_CARDS.concat(MEM_CARDS)).map((c,i)=>({c,i}));
  memState={cards,opened:[],lock:false,found:0};
  $('logicBox').innerHTML='<p class="sub center">翻开卡片，找到一样的两个小伙伴！👇</p>'+
    '<div class="memgrid">'+cards.map(c=>'<button class="mem" data-i="'+c.i+'" onclick="memFlip(this)">'+c.c+'</button>').join('')+'</div>';
}
function memFlip(btn){
  const m=memState;if(!m||m.lock)return;
  if(btn.classList.contains('flip')||btn.classList.contains('done'))return;
  btn.classList.add('flip');
  m.opened.push(btn);
  tone(600,.08,'triangle',.12);
  if(m.opened.length===2){
    m.lock=true;
    const [a,b]=m.opened;
    if(a.textContent===b.textContent){
      setTimeout(()=>{
        a.classList.add('done');b.classList.add('done');
        m.opened=[];m.lock=false;m.found++;
        sndOK();state.logic.correct++;save();checkBadges();
        if(state.logic.correct%3===0)completeTask('t_logic');
        if(m.found===MEM_CARDS.length){
          state.logic.memWin++;save();checkBadges();
          addStars(5,innerWidth/2,innerHeight/2);
          confetti();sndWin();
          toast('🎉 全部配对成功！奖励 5 颗星！');
          setTimeout(logicMem,1800);
        }
      },450);
    }else{
      setTimeout(()=>{
        a.classList.remove('flip');b.classList.remove('flip');
        m.opened=[];m.lock=false;sndNO();
      },800);
    }
  }
}

/* 预缓存常用语音：字母 26 + 数字 21 + 常用字词 24，串行下载写入 IndexedDB */
let preloading=false;
async function preloadVoices(){
  if(preloading){preloading=false;$('preloadNote').textContent='⏸ 已停止。';return;}
  if(ttsMode==='off'){$('preloadNote').textContent='请先选择云朵姐姐或阳光哥哥，再预缓存。';return;}
  preloading=true;
  $('preloadBtn').textContent='⏸ 停止下载';
  const items=[];
  LETTERS.forEach(L=>items.push([L,'en-US']));
  CN_NUM.forEach(n=>items.push([n,'zh-CN']));
  WORDS.forEach(w=>items.push([w.ch+'，'+w.word,'zh-CN']));
  const total=items.length;let done=0,skip=0,fail=0;
  for(const it of items){
    if(!preloading)break;
    const t=it[0],voice=pickVoice(it[1]),key=t+'|'+voice;
    if(ttsCache.get(key)||(await ttsDB.get(key))){skip++;done++;}
    else{
      try{
        const blob=await edgeSpeak(t,voice);
        ttsDB.put(key,blob);
        ttsCache.set(key,URL.createObjectURL(blob));
      }catch(e){fail++;}
      done++;
      $('preloadNote').textContent='⏳ 正在下载 '+done+' / '+total+' …';
      await new Promise(r=>setTimeout(r,250));
    }
  }
  preloading=false;
  $('preloadBtn').textContent='⬇️ 预缓存常用语音';
  if(fail>=10&&fail===done-skip){
    $('preloadNote').textContent='❌ 下载失败：真人语音需要用 Edge 浏览器打开本页面。';
  }else{
    const n=await ttsDB.count();
    $('preloadNote').textContent='✅ 完成！新下载 '+(done-skip-fail)+' 条，已有 '+skip+' 条，失败 '+fail+' 条。本机共缓存 '+n+' 条。';
  }
}

/* ============ 电视遥控 / 键盘导航 ============ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){go('home');return;}
  if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;
  const focused=document.activeElement;
  if(!focused||!focused.classList||!['opt','tab','modbtn','tile','mem','task','btn','seg','pchar'].some(c=>focused.classList.contains(c)))return;
  // 找到当前可见视图内所有可交互按钮，做网格式移动
  const view=document.querySelector('.view.active')||document;
  const btns=[...view.querySelectorAll('button')].filter(b=>b.offsetParent!==null);
  const idx=btns.indexOf(focused);if(idx<0)return;
  let next=-1;
  if(e.key==='ArrowRight')next=idx+1;
  if(e.key==='ArrowLeft')next=idx-1;
  if(e.key==='ArrowDown'){
    // 估算下移：找同一视图里横向位置最接近的下一行按钮
    const r=focused.getBoundingClientRect();
    next=btns.findIndex((b,i)=>i>idx&&b.getBoundingClientRect().top>r.top+r.height*.6);
  }
  if(e.key==='ArrowUp'){
    const r=focused.getBoundingClientRect();
    for(let i=idx-1;i>=0;i--){if(btns[i].getBoundingClientRect().bottom<r.top-r.height*.6){next=i;break;}}
  }
  if(next>=0&&next<btns.length){e.preventDefault();btns[next].focus();}
});
